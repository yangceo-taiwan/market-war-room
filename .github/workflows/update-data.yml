name: 更新市場公開資料

on:
  schedule:
    # GitHub Actions 使用 UTC；以下對應台北時間 08:10、12:10、23:10。
    - cron: "10 0,4,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 取得專案
        uses: actions/checkout@v7
      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: 安裝 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: 安裝套件
        run: pnpm install --frozen-lockfile
      - name: 更新公開資料
        run: pnpm run update:data
      - name: 驗證網站可建置
        run: pnpm run build
      - name: 提交有變更的資料
        run: |
          git config user.name "market-war-room-bot"
          git config user.email "market-war-room-bot@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "沒有資料變更"
          else
            git commit -m "data: scheduled market update"
            git push
          fi
